name: Build

on:
  workflow_call:
    inputs:
      package:
        description: Package to build
        required: true
        type: string
      version:
        description: Expected package version
        required: true
        type: string
      architecture:
        description: Target architecture
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ inputs.package }} (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    permissions:
      contents: read
      attestations: write
      id-token: write

    env:
      PACKAGE: ${{ inputs.package }}
      STORE_ARCHIVE: store-${{ inputs.architecture }}.export

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate inputs
        uses: ./.github/actions/validate-inputs
        with:
          package: ${{ inputs.package }}
          architecture: ${{ inputs.architecture }}

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: "2.35.4"
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Validate version
        uses: ./.github/actions/validate-version
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}

      - name: Build binary archive
        run: |
          nix build ".#archive.${PACKAGE}" \
            --out-link result \
            --no-update-lock-file \
            --print-build-logs

      - name: Export store closure
        uses: ./.github/actions/export-store
        with:
          package: ${{ inputs.package }}
          path: ${{ env.STORE_ARCHIVE }}

      - name: Attest build artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            result/*.tar.gz
            ${{ env.STORE_ARCHIVE }}
          create-storage-record: false

      - name: Upload binary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ inputs.package }}-${{ inputs.architecture }}
          path: result/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload store closure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-${{ inputs.package }}-${{ inputs.architecture }}
          path: ${{ env.STORE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
