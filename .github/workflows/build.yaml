# .github/workflows/build.yaml
name: Build

on:
  workflow_call:
    inputs:
      package:
        description: Package to build
        required: true
        type: string
      version:
        description: Expected package version
        required: true
        type: string
      architecture:
        description: Target architecture
        required: true
        type: string
      sha:
        description: Release commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ inputs.package }} (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    permissions:
      contents: read

    env:
      PACKAGE: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      ARCHITECTURE: ${{ inputs.architecture }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Validate inputs
        uses: ./.github/actions/validate-inputs # zizmor: ignore[self-repository]
        with:
          package: ${{ inputs.package }}
          architecture: ${{ inputs.architecture }}

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: "2.35.4"
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Validate version
        uses: ./.github/actions/validate-version # zizmor: ignore[self-repository]
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}

      - name: Build binary archive
        run: |
          set -euo pipefail

          mkdir dist

          nix build ".#archive.${PACKAGE}" \
            --out-link archive \
            --no-update-lock-file \
            --print-build-logs

          archives=(archive/*.tar.gz)

          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo "Expected exactly one binary archive" >&2
            exit 1
          fi

          cp "${archives[0]}" "dist/${PACKAGE}-${VERSION}-linux-${ARCHITECTURE}.tar.gz"

      - name: Build container image
        run: |
          set -euo pipefail

          nix run ".#image.${PACKAGE}.copyTo" \
            --no-update-lock-file \
            -- "oci-archive:dist/image-${ARCHITECTURE}.tar"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ inputs.package }}-${{ inputs.architecture }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  attest:
    name: Attest ${{ inputs.package }} (${{ inputs.architecture }})
    needs: package
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-${{ inputs.package }}-${{ inputs.architecture }}
          path: artifacts

      - name: Attest build artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.tar
          create-storage-record: false
