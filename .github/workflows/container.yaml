name: Container

on:
  workflow_call:
    inputs:
      package:
        description: Package to publish
        required: true
        type: string
      version:
        description: Image version
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: container-${{ inputs.package }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  PACKAGE: ${{ inputs.package }}
  VERSION: ${{ inputs.version }}
  DOCKERHUB_NAMESPACE: scaledigital

jobs:
  verify:
    name: Verify artifacts
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-${{ inputs.package }}-*
          path: artifacts
          merge-multiple: true

      - name: Verify build attestations
        shell: bash
        run: |
          set -euo pipefail

          for architecture in amd64 arm64; do
            files=(
              "artifacts/image-${architecture}.tar"
              "artifacts/${PACKAGE}-${VERSION}-linux-${architecture}.tar.gz"
            )

            for file in "${files[@]}"; do
              test -f "$file"

              gh attestation verify "$file" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow \
                  "${GITHUB_REPOSITORY}/.github/workflows/build.yaml" \
                --source-digest "$GITHUB_SHA" \
                --signer-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners
            done
          done

      - name: Validate images
        shell: bash
        run: |
          set -euo pipefail

          for architecture in amd64 arm64; do
            skopeo inspect --config "oci-archive:${PWD}/artifacts/image-${architecture}.tar" |
              jq -e \
                --arg architecture "$architecture" \
                --arg version "$VERSION" \
                '
                  .os == "linux"
                  and .architecture == $architecture
                  and .config.Labels["org.opencontainers.image.version"] == $version
                '
          done

  publish:
    name: Publish to ${{ matrix.registry }}
    needs: verify
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        registry:
          - ghcr.io
          - docker.io

    env:
      REGISTRY: ${{ matrix.registry }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-${{ inputs.package }}-*
          path: artifacts
          merge-multiple: true

      - name: Prepare image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REGISTRY" == "ghcr.io" ]]; then
            namespace="${GITHUB_REPOSITORY_OWNER,,}"
          else
            namespace="$DOCKERHUB_NAMESPACE"
          fi

          echo "name=${REGISTRY}/${namespace}/${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry == 'ghcr.io' && github.actor || vars.DOCKERHUB_USERNAME }}
          password: ${{ matrix.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Publish manifest
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          if skopeo inspect --raw "docker://${IMAGE}:${VERSION}" > existing.json 2>/dev/null; then
            digest="$(skopeo manifest-digest existing.json)"
            echo "Image already exists: ${IMAGE}:${VERSION}@${digest}"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest="localhost/${PACKAGE}-${GITHUB_RUN_ID}"

          buildah manifest create "$manifest"

          for architecture in amd64 arm64; do
            buildah manifest add \
              --os linux \
              --arch "$architecture" \
              "$manifest" \
              "oci-archive:${PWD}/artifacts/image-${architecture}.tar"
          done

          buildah manifest push \
            --all \
            --format oci \
            --rm \
            --digestfile digest.txt \
            "$manifest" \
            "docker://${IMAGE}:${VERSION}"

          digest="$(<digest.txt)"

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${digest}"

      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

  confirm:
    name: Verify ${{ matrix.registry }}
    needs: publish
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        registry:
          - ghcr.io
          - docker.io

    env:
      REGISTRY: ${{ matrix.registry }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Log in to GHCR
        if: matrix.registry == 'ghcr.io'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Verify published image
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REGISTRY" == "ghcr.io" ]]; then
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PACKAGE}"
          else
            image="docker.io/${DOCKERHUB_NAMESPACE}/${PACKAGE}"
          fi

          skopeo inspect --raw "docker://${image}:${VERSION}" > manifest.json
          digest="$(skopeo manifest-digest manifest.json)"

          echo "${image}:${VERSION}@${digest}"

          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] | sort
              == ["linux/amd64", "linux/arm64"]
          ' manifest.json

          gh attestation verify "oci://${image}@${digest}" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/container.yaml" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

          cosign verify \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${image}@${digest}" >/dev/null
