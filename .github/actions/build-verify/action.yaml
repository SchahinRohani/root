name: Verify build artifacts
description: Verify attestations, release metadata and artifact hashes

inputs:
  package:
    description: Expected package name
    required: true
  version:
    description: Expected release version
    required: true
  sha:
    description: Expected release commit
    required: true

runs:
  using: composite
  steps:
    - name: Verify build artifacts
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        RELEASE_SHA: ${{ inputs.sha }}
      with:
        script: |
          const { createHash } = require('node:crypto');
          const { createReadStream } = require('node:fs');
          const { readFile, stat } = require('node:fs/promises');
          const { join } = require('node:path');
          const { isDeepStrictEqual } = require('node:util');

          const {
            PACKAGE: packageName,
            VERSION: version,
            RELEASE_SHA: releaseSha,
            GITHUB_REPOSITORY: repository,
            GITHUB_SHA: workflowSha,
          } = process.env;

          for (const architecture of ['amd64', 'arm64']) {
            const metadataPath = join(
              'artifacts',
              `build-${architecture}.json`,
            );

            const filenames = [
              `${packageName}-${version}-linux-${architecture}.tar.gz`,
              `image-${architecture}.tar`,
            ];

            const paths = [
              metadataPath,
              ...filenames.map((filename) => join('artifacts', filename)),
            ];

            for (const path of paths) {
              if (!(await stat(path)).isFile()) {
                throw new Error(`Expected a regular file: ${path}`);
              }

              await exec.exec('gh', [
                'attestation',
                'verify',
                path,
                '--repo',
                repository,
                '--signer-workflow',
                `${repository}/.github/workflows/build.yaml`,
                '--source-digest',
                workflowSha,
                '--signer-digest',
                workflowSha,
                '--deny-self-hosted-runners',
              ]);
            }

            const artifacts = {};

            for (const filename of filenames) {
              const hash = createHash('sha256');

              for await (const chunk of createReadStream(
                join('artifacts', filename),
              )) {
                hash.update(chunk);
              }

              artifacts[filename] = hash.digest('hex');
            }

            const expected = {
              schema: 1,
              package: packageName,
              version,
              architecture,
              sha: releaseSha,
              artifacts,
            };

            const metadata = JSON.parse(
              await readFile(metadataPath, 'utf8'),
            );

            if (!isDeepStrictEqual(metadata, expected)) {
              throw new Error(
                `Build metadata does not match expected release artifacts: ${metadataPath}`,
              );
            }

            core.info(
              `Verified ${packageName}@${version} (${architecture}, ${releaseSha})`,
            );
          }
