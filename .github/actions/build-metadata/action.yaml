name: Record build metadata
description: Bind build artifacts to the checked-out release commit

inputs:
  package:
    description: Package name
    required: true
  version:
    description: Release version
    required: true
  architecture:
    description: Target architecture
    required: true
  sha:
    description: Expected release commit
    required: true

runs:
  using: composite
  steps:
    - name: Record build metadata
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        ARCHITECTURE: ${{ inputs.architecture }}
        RELEASE_SHA: ${{ inputs.sha }}
      with:
        script: |
          const { createHash } = require('node:crypto');
          const { createReadStream } = require('node:fs');
          const { stat, writeFile } = require('node:fs/promises');
          const { join } = require('node:path');

          const {
            PACKAGE: packageName,
            VERSION: version,
            ARCHITECTURE: architecture,
            RELEASE_SHA: expectedSha,
          } = process.env;

          const { stdout } = await exec.getExecOutput(
            'git',
            ['rev-parse', 'HEAD'],
            { silent: true },
          );

          const sha = stdout.trim();

          if (sha !== expectedSha) {
            throw new Error(
              `Checkout does not match release commit: ${expectedSha}`,
            );
          }

          const filenames = [
            `${packageName}-${version}-linux-${architecture}.tar.gz`,
            `image-${architecture}.tar`,
          ];

          const artifacts = {};

          for (const filename of filenames) {
            const path = join('dist', filename);

            if (!(await stat(path)).isFile()) {
              throw new Error(`Expected a regular file: ${path}`);
            }

            const hash = createHash('sha256');

            for await (const chunk of createReadStream(path)) {
              hash.update(chunk);
            }

            artifacts[filename] = hash.digest('hex');
          }

          const metadata = {
            schema: 1,
            package: packageName,
            version,
            architecture,
            sha,
            artifacts,
          };

          await writeFile(
            join('dist', `build-${architecture}.json`),
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
